on: [push, pull_request]
name: test-vulnerabilities

permissions:
  contents: write

jobs:
  test-vulnerabilities:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, 'skip ci')"
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::renv, any::vulnr

      - name: Check vulnerabilities
        id: check_vulnerabilities
        continue-on-error: true
        run: |
          vulnr::check(
            lib = NULL,
            renv_file = NULL,
            dcf = "DESCRIPTION",
            dependencies = TRUE,
            return_cves = FALSE
          )
        shell: Rscript {0}

      # A PR checks out a temporary merge commit by default. Switch to its
      # source branch so the target branch's badge becomes part of the PR.
      - name: Check out PR source branch for badge
        if: github.event_name == 'pull_request' && github.base_ref == 'master' && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Create vulnerability badge data
        if: (github.event_name == 'push' && github.ref_name == 'dev') || (github.event_name == 'pull_request' && github.base_ref == 'master' && github.event.pull_request.head.repo.full_name == github.repository)
        env:
          BADGE_BRANCH: ${{ github.event_name == 'pull_request' && github.base_ref || github.ref_name }}
        run: |
          cves <- vulnr::check(
            lib = NULL,
            renv_file = NULL,
            dcf = "DESCRIPTION",
            dependencies = TRUE,
            return_cves = TRUE
          )
          count <- if (is.null(cves)) 0L else nrow(cves)
          colour <- if (count == 0L) "brightgreen" else "red"
          badge <- list(
            schemaVersion = 1,
            label = paste("vulnerabilities", Sys.getenv("BADGE_BRANCH")),
            message = as.character(count),
            color = colour
          )
          dir.create("badges", showWarnings = FALSE)
          jsonlite::write_json(
            badge,
            path = file.path("badges", paste0("vulnerabilities-", Sys.getenv("BADGE_BRANCH"), ".json")),
            auto_unbox = TRUE,
            pretty = TRUE
          )
        shell: Rscript {0}

      - name: Commit vulnerability badge data
        if: (github.event_name == 'push' && github.ref_name == 'dev') || (github.event_name == 'pull_request' && github.base_ref == 'master' && github.event.pull_request.head.repo.full_name == github.repository)
        env:
          BADGE_BRANCH: ${{ github.event_name == 'pull_request' && github.base_ref || github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "badges/vulnerabilities-${BADGE_BRANCH}.json"
          if ! git diff --cached --quiet; then
            git commit -m "Update ${BADGE_BRANCH} vulnerability badge"
            git push
          fi

      - name: Fail when vulnerabilities are found
        if: steps.check_vulnerabilities.outcome == 'failure'
        run: exit 1
